<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* 캔버스가 창(itch.io iframe·전체화면) 크기를 그대로 채운다. 게임 쪽이 화면 비율을 맞춘다 */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b120b; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #1b120b; outline: none; }
      #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 40%; max-width: 360px; text-align: center; font: 14px sans-serif; color: #e8d2a8; }
      #bar { margin-top: 10px; height: 10px; border-radius: 5px; background: #3a2616; overflow: hidden; }
      #bar-full { width: 0%; height: 100%; background: #f2b84b; }
      #warning { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font: 13px sans-serif; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">{{{ PRODUCT_NAME }}}<div id="bar"><div id="bar-full"></div></div></div>
    <div id="warning"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      function unityShowBanner(msg, type) {
        var w = document.querySelector("#warning"), div = document.createElement("div");
        div.innerHTML = msg;
        div.style = "padding: 8px; background: " + (type == "error" ? "#c0392b; color: #fff" : "#f1c40f");
        w.appendChild(div); w.style.display = "block";
        if (type != "error") setTimeout(function () { w.removeChild(div); if (!w.children.length) w.style.display = "none"; }, 5000);
      }
      var script = document.createElement("script");
      script.src = "Build/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, {
          arguments: [],
          dataUrl: "Build/{{{ DATA_FILENAME }}}",
          frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
          workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
          codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
          streamingAssetsUrl: "StreamingAssets",
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
          autoSyncPersistentDataPath: true,   // 세이브(save.dat)·로그 큐(logq.dat) 파일을 바로 브라우저 저장소(IndexedDB)에 반영
          showBanner: unityShowBanner,
        }, function (p) {
          document.querySelector("#bar-full").style.width = (100 * p) + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
