function drawDecor(g, id, x, y, now) {
  const P = () => g.beginPath();
  g.save(); g.lineJoin = 'round';
  const shadow = (rx, ry) => { g.fillStyle = 'rgba(30,60,20,.25)'; P(); g.ellipse(x, y + 2, rx, ry, 0, 0, TAU); g.fill(); };
  const shroom = (cx, by, h, rx, ry, cap, dots) => {   // 받침 기둥 + 반원 갓
    P(); g.roundRect(cx - rx * 0.22, by - h, rx * 0.44, h, 6); fillStroke(g, '#f4e6cc', 3);
    P(); g.ellipse(cx, by - h, rx, ry, 0, Math.PI, 0); g.quadraticCurveTo(cx, by - h + ry * 0.35, cx - rx, by - h); g.closePath(); fillStroke(g, cap, 3);
    if (dots) { g.fillStyle = '#fff'; for (const [dx, dy, rr] of [[-0.45, -0.45, 0.13], [0.1, -0.7, 0.11], [0.5, -0.35, 0.12]]) { P(); g.arc(cx + dx * rx, by - h + dy * ry, rr * rx, 0, TAU); g.fill(); } }
  };
  if (id === 'dc_table') {
    shadow(150, 26);
    shroom(x - 100, y + 6, 26, 32, 16, '#a0602a', false); shroom(x + 100, y + 6, 26, 32, 16, '#a0602a', false);
    shroom(x, y, 52, 82, 30, '#e0252f', true);
    g.font = '24px sans-serif'; g.textAlign = 'center'; g.fillText('🍵', x - 22, y - 62); g.fillText('🍪', x + 26, y - 60);
  } else if (id === 'dc_fire') {
    shadow(70, 20);
    for (let i = 0; i < 9; i++) { const a = i / 9 * TAU; P(); g.ellipse(x + Math.cos(a) * 52, y - 8 + Math.sin(a) * 16, 14, 10, 0, 0, TAU); fillStroke(g, '#9a968c', 2.5); }
    P(); g.ellipse(x, y - 14, 40, 14, 0, 0, TAU); g.fillStyle = '#3a2418'; g.fill();
    const gl = g.createRadialGradient(x, y - 30, 4, x, y - 30, 110); gl.addColorStop(0, 'rgba(255,190,80,.35)'); gl.addColorStop(1, 'rgba(255,150,40,0)'); g.fillStyle = gl; P(); g.arc(x, y - 30, 110, 0, TAU); g.fill();
    for (let i = 0; i < 3; i++) {

      P(); g.moveTo(fx - 14, y - 16); g.quadraticCurveTo(fx - 16, y - 16 - h * 0.6, fx + Math.sin(now * 6 + i) * 5, y - 16 - h); g.quadraticCurveTo(fx + 16, y - 16 - h * 0.6, fx + 14, y - 16); g.closePath();

      g.fillStyle = 'rgba(30,60,20,.25)'; P(); g.ellipse(lx, y + 2, 26, 8, 0, 0, TAU); g.fill();
      const gl = g.createRadialGradient(lx, y - 92, 4, lx, y - 92, 80); gl.addColorStop(0, `rgba(160,255,215,${pulse})`); gl.addColorStop(1, 'rgba(160,255,215,0)'); g.fillStyle = gl; P(); g.arc(lx, y - 92, 80, 0, TAU); g.fill();
      P(); g.roundRect(lx - 6, y - 92, 12, 92, 4); fillStroke(g, '#f4e6cc', 3);
      P(); g.ellipse(lx, y - 92, 30, 24, 0, Math.PI, 0); g.closePath(); fillStroke(g, '#8ff0c8', 3);
      g.fillStyle = '#fff'; P(); g.arc(lx - 8, y - 104, 4, 0, TAU); g.fill();
    }
  } else if (id === 'dc_bed') {
    shadow(90, 16);
    P(); g.roundRect(x - 85, y - 34, 170, 36, 8); fillStroke(g, '#a0703e', 3);
    g.fillStyle = '#6e4426'; g.fillRect(x - 78, y - 34, 156, 10);
    for (let i = 0; i < 7; i++) {
      const fx = x - 70 + i * 23, fy = y - 46 - (i % 2) * 10, col = ['#ff9ac0', '#ffd84a', '#b8a4ff', '#ff6a5a'][i % 4];
      g.strokeStyle = '#3f8a34'; g.lineWidth = 3; P(); g.moveTo(fx, y - 30); g.lineTo(fx, fy); g.stroke();
      g.fillStyle = col; for (let j = 0; j < 5; j++) { const a = j * TAU / 5; P(); g.arc(fx + Math.cos(a) * 6, fy + Math.sin(a) * 6, 5, 0, TAU); g.fill(); }
      g.fillStyle = '#fff6b0'; P(); g.arc(fx, fy, 3, 0, TAU); g.fill();
    }
  } else if (id === 'dc_swing') {
    shadow(120, 20);
    for (const s of [-1, 1]) { P(); g.roundRect(x + s * 80 - 9, y - 150, 18, 150, 6); fillStroke(g, '#f4e6cc', 3); }
    P(); g.ellipse(x, y - 152, 120, 34, 0, Math.PI, 0); g.closePath(); fillStroke(g, '#3fae4a', 3);
    g.fillStyle = '#fff'; for (const dx of [-60, 0, 60]) { P(); g.arc(x + dx, y - 168, 8, 0, TAU); g.fill(); }
    const sw = Math.sin(now * 1.6) * 0.22;

    g.strokeStyle = '#8a5a2e'; g.lineWidth = 3; P(); g.moveTo(-34, 0); g.lineTo(-34, 110); g.moveTo(34, 0); g.lineTo(34, 110); g.stroke();
    P(); g.roundRect(-44, 106, 88, 12, 4); fillStroke(g, '#c8884a', 3);
    g.restore();
  } else if (id === 'dc_well') {
    shadow(90, 22);
    P(); g.ellipse(x, y - 14, 84, 28, 0, 0, TAU); fillStroke(g, '#b8b2a4', 3);
    P(); g.ellipse(x, y - 18, 70, 20, 0, 0, TAU); g.fillStyle = '#6ec8f0'; g.fill();
    g.fillStyle = 'rgba(255,255,255,.6)'; P(); g.ellipse(x - 26, y - 22, 16, 4, 0, 0, TAU); g.fill();
    shroom(x, y - 18, 62, 40, 22, '#5fb8ff', true);
    g.fillStyle = '#bfeaff';
    for (let i = 0; i < 8; i++) { const t = (now * 0.9 + i / 8) % 1, a = (i / 8) * TAU, d = t * 60; P(); g.arc(x + Math.cos(a) * d, y - 102 + t * t * 80 - t * 30, 4 * (1 - t) + 1, 0, TAU); g.fill(); }
  } else if (id === 'dc_house') {
    shadow(110, 24);
    P(); g.roundRect(x - 60, y - 100, 120, 100, 14); fillStroke(g, '#f4e6cc', 3);
    P(); g.roundRect(x - 18, y - 56, 36, 56, [18, 18, 0, 0]); fillStroke(g, '#8a5a2e', 3);
    const lit = 0.6 + 0.3 * Math.sin(now * 1.3);
    P(); g.arc(x + 36, y - 66, 13, 0, TAU); g.fillStyle = `rgba(255,220,120,${lit})`; g.fill(); g.lineWidth = 3; g.strokeStyle = OL; g.stroke();
    P(); g.ellipse(x, y - 100, 100, 66, 0, Math.PI, 0); g.quadraticCurveTo(x, y - 82, x - 100, y - 100); g.closePath(); fillStroke(g, '#e0252f', 3.5);
    g.fillStyle = '#fff'; for (const [dx, dy, rr] of [[-50, -130, 14], [10, -150, 11], [56, -120, 12], [-14, -116, 8]]) { P(); g.arc(x + dx, y + dy, rr, 0, TAU); g.fill(); }
  } else if (id === 'dc_statue') {

    g.translate(x, y - 108 + Math.sin(now * 1.5) * 4); drawGem(g, 52, 3.5);

}
function decorURL(id, w = 240, h = 200) {

  const c = document.createElement('canvas'); c.width = w; c.height = h;

}

function buySkin(id) {

  const sk = SKIN[id], ch = CHAR_SKINS.includes(sk), slot = G.skins[ch ? 'ch' : 'hv'];
  if (!skinOwn(id)) return;
  slot[sk.of] = slot[sk.of] === id ? null : id;
  saveGame(); Snd.ui();

// ===== 꼬마 정보 (호감도·진화·스킨) =====
function openPetCard(id) {
  const k = SPC[id], e = evoOf(id), h = heartsOf(id), full = h >= FARM.hearts, per = heartPer(id);

      <div class="pc-h"><b>호감도</b><div class="hearts">${hearts}</div><small>${full ? (e < FARM.evoMax ? '가득 찼어요! 진화할 수 있어요' : '가득') : `다음 칸까지 부탁 ${left}번 (한 칸 = 부탁 ${per}번)`}</small></div>

// 주문하면 재료를 바로 쓰고(FARM_RT.orders), 쉬고 있는 꼬마가 맡아서 만든다. 다 차리면 G.dishes에 들어가 다음 라운드에 먹는다
const KIT = {
  counter: { x: 770, y: 830 }, stove: { x: 420, y: 830 }, table: { x: 980, y: 960 },
  steps: [['counter', 1.0, '🔪'], ['stove', 1.6, '🥄'], ['table', 0.5, '🍽️']],   // [어디서, 몇 초, 손에 든 것]

function kitIdleSpot() { return { x: rand(300, 1150), y: rand(880, 1020) }; }
function cookOrder(id, quiet) {

  if (!canCook(rc)) { if (!quiet) Snd.err(); return false; }
  const n = recipeNeed(rc);
  for (const k in n) { if (CATS[k]) consumeCat(k, n[k]); else G[k] -= n[k]; }
  FARM_RT.orders.push({ rid: id }); FARM_RT.cooking[id] = true;

}
function cookAll() {
  const made = RECIPES.filter(rc => cookOrder(rc.id, true));
  if (!made.length) { Snd.err(); toast(FARM_RT.kc.length ? '지금 만들 수 있는 요리가 없어요' : '특수 버섯(꼬마)을 잡으면 요리를 해 줘요'); return; }

}
function finishOrder(o, quiet) {

}
function updateKitchen(dt) {
  for (const c of FARM_RT.kc) {
    c.t -= dt;
    if (tickCritter(c, dt) && !c.order) continue;
    const ev = FARM.evoSpd[evoOf(c.id)];
    if (c.order) {
      const [where, dur, tool] = KIT.steps[c.step], at = KIT[where];
      if (c.state === 'walk') { if (walkTo(c, at.x + c.slot, at.y, 340 * ev, dt)) { c.state = 'work'; c.t = dur / ev; c.tool = tool; } }
      else if (c.state === 'work' && c.t <= 0) {
        if (c.step < KIT.steps.length - 1) { c.step++; c.state = 'walk'; }
        else { const o = c.order; c.order = null; c.tool = null; c.state = 'idle'; c.t = rand(0.5, 1.5); finishOrder(o, false); }
      }
      continue;
    }
    if (FARM_RT.orders.length) { c.order = FARM_RT.orders.shift(); c.step = 0; c.state = 'walk'; c.anim = null; c.slot = rand(-50, 50); c.tool = null; if (FARM_RT.view === 'kitchen') { c.say = `${RECIPE[c.order.rid].n} 만들게!`; c.sayT = 1.8; } continue; }

    else if (c.t <= 0) { const s = kitIdleSpot(); c.tx = s.x; c.ty = s.y; c.state = 'walk'; c.t = 8; if (FARM_RT.view === 'kitchen' && chance(0.06)) { c.say = pick(FARM_LINES.kitchen); c.sayT = 2.4; } }

  for (const [x, y, s, col] of [[200, 1010, 1.2, '#e0252f'], [1760, 1000, 1, '#f28c28'], [1660, 210, 0.8, '#9b4fd1']]) {

    g.fillStyle = '#fff'; for (const [dx, dy, rr] of [[-30, -78, 10], [12, -95, 8], [36, -72, 9]]) { g.beginPath(); g.arc(x + dx * s, y + dy * s, rr * s, 0, TAU); g.fill(); }
  }
  // 나무 울타리 (위쪽 가운데는 문, 왼쪽·오른쪽 가운데는 밭·식당으로 가는 길목)
  const F = { x0: FARM.box.x0 - 60, y0: FARM.box.y0 - 110, x1: FARM.box.x1 + 60, y1: FARM.box.y1 + 70 };
  const post = (x, y) => { g.beginPath(); g.roundRect(x - 9, y - 46, 18, 52, 5); fillStroke(g, '#c8884a', 3); g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(x - 5, y - 42, 4, 40); };

  for (let y = F.y0 + 70; y < F.y1; y += 70) if (y < sideA - 10 || y > sideB + 30) { post(F.x0, y); post(F.x1, y); }

function drawFarm(g, dt, now) {
  updatePets(dt); updateField(dt); updateKitchen(dt);
  for (const q of FARM_RT.parts) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.k === 'gem' || q.k === 'dirt') q.vy += 700 * dt; }
  FARM_RT.parts = FARM_RT.parts.filter(q => q.t < q.life).slice(-200);
  for (const f of FARM_RT.floats) { f.t += dt; f.y -= 40 * dt; }
  FARM_RT.floats = FARM_RT.floats.filter(f => f.t < 1.4);
  // 카메라: 장면 사이를 옆으로 미끄러지며, 가운데쯤에서 살짝 멀어졌다 다시 다가온다
  const C = FARM_RT.cam;
  let x = SCENE_X[FARM_RT.view], z = 1;
  if (C) {
    C.t = Math.min(1, C.t + dt / C.dur);
    const u = C.t < 0.5 ? 4 * C.t ** 3 : 1 - (-2 * C.t + 2) ** 3 / 2;
    x = lerp(C.from, C.to, u); z = 1 - 0.12 * Math.sin(Math.PI * C.t);

  }
  g.fillStyle = '#2e4a22'; g.fillRect(0, 0, W, H);
  g.save(); g.translate(960, 540); g.scale(z, z); g.translate(-960, -540);
  for (const [v, fn] of [['field', drawField], ['pets', drawPetsScene], ['kitchen', drawKitchen]]) {
    const ox = (SCENE_X[v] - x) * W;
    if (Math.abs(ox) >= W) continue;
    g.save(); g.translate(ox, 0); fn(g, now); g.restore();
  }
  g.restore();
  if (C) { const vg = g.createRadialGradient(960, 540, 400, 960, 540, 1100); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(20,30,10,${0.45 * Math.sin(Math.PI * C.t)})`); g.fillStyle = vg; g.fillRect(0, 0, W, H); }

// ===== 정산 (점수 → 골드, 수확한 버섯 → 창고, 체납 차감) =====
// 버섯은 자동으로 팔리지 않고 창고(G.inv)에 쌓인다. 버섯 상점에서 원하는 개수만큼 판다.
// 세금 기준 수익(G.tax.income) = 점수 골드 + 특수 버섯 보너스 + 수확한 버섯의 가치(팔았는지와 무관)
//   → 버섯을 쌓아 두었다가 세금 뒤에 파는 식으로 세금을 피할 수 없다.
function finishRound() {
  const st = R.st;
  const scoreGold = Math.floor(R.score * st.goldMul);
  const bonusGold = Math.floor(R.bonusGold);
  const value = Math.floor(R.value);
  const debtTaken = gainGold(scoreGold + bonusGold);
  const net = scoreGold + bonusGold - debtTaken;
  for (const id in R.bag) G.inv[id] = (G.inv[id] || 0) + R.bag[id];
  const recs = [];
  const cur = { score: R.score, combo: R.maxCombo, harvest: R.harvests, balls: R.maxBalls, chain: R.maxChain };
  for (const k in cur) if (cur[k] > G.rec[k]) { recs.push({ k, old: G.rec[k], v: cur[k] }); G.rec[k] = cur[k]; }
  G.tax.income += scoreGold + bonusGold + value;
  G.tax.roundsIn++;
  G.rounds++;
  if (goldenCount() >= 15 && !G.hv.gold) { G.hv.gold = 1; G.hvOn.gold = true; recs.push({ k: 'goldhv' }); }
  // 10스테이지마다 새 지역: 열리면 다음 라운드 지역으로 자동 선택
  const newTheme = THEMES.find(t => t.from > 1 && t.from === stageNow()) || null;
  if (newTheme) G.theme = newTheme.id;
  const unlocks = checkUnlocks();
  saveGame();
  const sum = {
    score: R.score, scoreGold, bonusGold, value, debtTaken, net, goldMul: st.goldMul, gains: Object.assign({}, R.gains),
    newSpecies: R.newSpecies.slice(), newGolden: R.newGolden.slice(), newStars: R.newStars.slice(), specialGot: R.specialGot,
    unlocks, recs, harvests: R.harvests, newTheme: newTheme && newTheme.id, coinGold: Math.floor(R.coinGold),
  };
  R = null;
  showSettlement(sum);
}

      ${s.bonusGold ? `<div class="srow"><span>보너스 골드 <small>(엽전 수확기 ${fmt(s.coinGold)} · 특수 버섯 ${fmt(s.bonusGold - s.coinGold)})</small></span><b>+${fmt(s.bonusGold)}</b></div>` : ''}

      ${s.newTheme ? `<div class="newtheme">${THEME[s.newTheme].icon} 새 지역 열림: <b>${THEME[s.newTheme].n}</b><small>${THEME[s.newTheme].d} · 다음 라운드부터 이 지역으로 가요</small></div>` : ''}
      ${unl ? `<div class="snew"><div class="snh">🌱 새로 해금된 버섯 (다음 라운드부터 등장)</div><div class="newcards">${unl}</div></div>` : ''}
      ${newc ? `<div class="snew"><div class="snh">도감 소식</div><div class="newcards">${newc}</div></div>` : ''}

      </div>
    </div>`;
  // 바구니에 버섯이 후두둑
  const basket = $('basket');
  const pool = [];
  for (const c of CAT_KEYS) { const n = Math.min(14, Math.ceil(Math.sqrt(s.gains[c]))); for (let i = 0; i < n; i++) pool.push(c); }
  pool.sort(() => Math.random() - 0.5);
  pool.forEach((c, i) => {
    const sp = pick(SPECIES.filter(x => x.c === c && harvested(x.id))) || SPECIES.find(x => x.c === c);
    const im = document.createElement('img'); im.src = shroomURL(sp, 22); im.className = 'bshroom';
    im.style.left = (20 + Math.random() * 300) + 'px'; im.style.animationDelay = (i * 0.04) + 's';
    im.style.setProperty('--y', (60 - Math.random() * 40) + 'px');
    basket.appendChild(im);
  });
  // 롤링 카운터
  const t0 = performance.now();
  const roll = () => {
    const ease = d => { const k = clamp((performance.now() - t0 - d) / 1100, 0, 1); return 1 - Math.pow(1 - k, 3); };
    const a = $('s-score'), b = $('s-sale'), g = $('s-gold'); if (!a) return;
    a.textContent = '+' + fmt(s.scoreGold * ease(0));
    b.textContent = '≈' + fmt(s.value * ease(400));
    const e3 = ease(800);
    g.innerHTML = `<img src="${iconURL('gold', 34)}">${fmt(s.net * e3)}`;
    if (e3 < 1) requestAnimationFrame(roll); else Snd.buy();
  };
  requestAnimationFrame(roll);
}

function nextTaxUnlock() { return SPECIES.filter(s => s.tax && s.tax > G.tax.paid).sort((a, b) => a.tax - b.tax)[0] || null; }
// head: 결과 화면에서 보여 줄 (방금 끝난) 사이클 정보
function showTaxBill(result, head) {
  setScreen('tax');

      <div class="srow"><span>보유 골드</span><b class="${canPay ? '' : 'lack'}">${fmt(G.gold)}</b></div>
      ${invTotal() ? `<div class="srow"><span>창고 버섯 ${fmt(invTotal())}개 <small>(≈${fmt(invValue())}골드)</small></span><button data-act="shop">🍄 팔러 가기</button></div>` : ''}
      <div class="taxopts">

          <button class="big go ${canPay ? '' : 'disabled'}" data-act="taxpay">납부하기</button>
          <div class="tnote">−${fmt(bill)}골드 · 납부 ${T.paid + 1}회째${nu ? `<br>🧾 세금 ${nu.tax}회 납부 시 <b>${nu.tax === T.paid + 1 ? nu.n : '새 버섯'}</b> 해금` : ''}</div>
        </div>
        <div class="topt">
          <button class="big danger" data-act="taxskip">미납하기</button>
          <div class="tnote">이번 사이클 수익의 <b>${Math.round(rate * 100)}%</b> (−${fmt(penalty)}골드) 차감<br>미납 ${T.unpaid + 1}회째 · 다음 미납은 ${Math.round(taxRate(T.unpaid + 1) * 100)}%${penalty > G.gold ? '<br>골드가 모자란 만큼은 체납금으로 다음 수익에서 떼어 가요' : ''}</div>
        </div>
      </div>`;
  }
  $('screen').innerHTML = `
    <div class="settle taxbill">
      <h1>🧾 세금 고지서</h1>
      <div class="sub">사이클 ${head ? head.cycle : T.cycle} · ${TAX.every}라운드 동안 번 골드 <b>${fmt(head ? head.income : T.income)}</b></div>
      ${body}
    </div>`;
}
function taxPay() {
  const bill = taxBill();
  if (G.gold < bill) { Snd.err(); toast('골드가 모자라요'); return; }
  const head = { cycle: G.tax.cycle, income: G.tax.income };
  G.gold -= bill; G.tax.paid++;
  const unl = checkUnlocks();
  nextTaxCycle();
  Snd.record();
  showTaxBill(`<div class="tresult ok">납부 완료! <small>(누적 ${G.tax.paid}회)</small></div>
    ${unl.length ? `<div class="snew"><div class="snh">🧾 세금 납부로 해금된 버섯</div><div class="newcards">${unl.map(id => `<div class="newcard unlock"><img src="${shroomURL(SP[id], 34)}"><span>${SP[id].n}</span><i>해금</i></div>`).join('')}</div></div>` : ''}
    <div class="smeta">다음 세금: 사이클 ${G.tax.cycle} · ${TAX.every}라운드 뒤 · 그 사이클 수익의 ${Math.round(TAX.share * 100)}% (최소 ${fmt(taxAmount(G.tax.cycle))})</div>`, head);
}
function taxSkip() {
  const T = G.tax, rate = taxRate(T.unpaid), penalty = Math.ceil(T.income * rate);
  const head = { cycle: T.cycle, income: T.income };
  const take = Math.min(G.gold, penalty);
  G.gold -= take; T.debt += penalty - take; T.unpaid++;
  nextTaxCycle();
  Snd.err();
  showTaxBill(`<div class="tresult bad">미납… 수익의 ${Math.round(rate * 100)}% (−${fmt(penalty)}골드)를 떼어 갔어요</div>
    ${penalty > take ? `<div class="smeta">모자란 ${fmt(penalty - take)}골드는 체납금으로 다음 라운드 수익에서 자동 차감돼요</div>` : ''}
    <div class="smeta">다음 미납 시 ${Math.round(taxRate(T.unpaid) * 100)}% 차감 · 다음 세금: 사이클 ${G.tax.cycle} (최소 ${fmt(taxAmount(G.tax.cycle))})</div>`, head);
}
function nextTaxCycle() {
  G.tax.cycle++; G.tax.roundsIn = 0; G.tax.income = 0;
  G.quests = []; refreshQuests();   // 마을 의뢰 새로 받기
  saveGame();
}

const CUT = { t: 0, dur: 14 };
const CUT_LINES = [
  [0, '거대 버섯이 마을을 집어삼킨 지 여러 해…'],
  [3.5, '노련한 버섯 사냥꾼은 버섯을 하나도 빠짐없이 거두었다.'],
  [7, '버섯이 걷히자, 마을에 다시 햇살이 들었다.'],
  [10.5, `버섯 도감 ${SP_TOTAL}종 완성!`],
];
function startCutscene() {
  setScreen('cutscene');
  CUT.t = 0;
  $('screen').innerHTML = `<div class="cutscene"><div class="cut-cap" id="cutcap"></div><button class="ghost small cut-skip" data-act="cutskip">건너뛰기 ▶▶</button></div>`;
  Snd.record();
}
function drawCutscene(ctx, dt) {
  CUT.t += dt;
  const t = CUT.t, now = performance.now() / 1000;
  const restore = clamp((t - 6.5) / 3, 0, 1);       // 0 = 버섯 마을, 1 = 되찾은 마을
  drawTown(ctx, now, 1 - restore, restore);
  const gx = t < 3.5 ? -300 + t * 120 : lerp(120, 420, clamp((t - 3.5) / 2, 0, 1));
  drawGrandpa(ctx, gx + 200, 1010, 1.6, now, t > 3 && t < 7);
  if (t >= 10.5) {
    // 도감 60종이 할아버지 주위를 빙글
    const k = clamp((t - 10.5) / 1.2, 0, 1);
    SPECIES.forEach((sp, i) => {
      const a = i / SP_TOTAL * TAU + now * 0.3, rr = 380 * k;
      const spr = shroomSprite(sp, 22, G.codex[sp.id] && G.codex[sp.id].gold, 0);
      ctx.globalAlpha = k; ctx.drawImage(spr, 1100 + Math.cos(a) * rr - spr.width / 2, 520 + Math.sin(a) * rr * 0.75 - spr.height / 2); ctx.globalAlpha = 1;
    });
  }
  let line = '';
  for (const [s, l] of CUT_LINES) if (t >= s) line = l;
  const cap = $('cutcap'); if (cap && cap.textContent !== line) cap.textContent = line;
  const fade = t < 0.6 ? 1 - t / 0.6 : t > CUT.dur - 0.6 ? (t - (CUT.dur - 0.6)) / 0.6 : 0;
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
  if (t >= CUT.dur) showEnding();
}

function fit() {

  SCALE = Math.min(w / W, h / H);
  OFF.x = (w - W * SCALE) / 2; OFF.y = (h - H * SCALE) / 2;
  stage.style.transform = `translate(${OFF.x}px, ${OFF.y}px) scale(${SCALE})`;
}
function domToStage(cx, cy) { return { x: (cx - OFF.x) / SCALE, y: (cy - OFF.y) / SCALE }; }

// 클릭 위임
document.getElementById('ui').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (e.target.id === 'modal') closeModal(); return; }
  if (el.classList.contains('disabled')) { Snd.err(); return; }
  onAction(el.dataset.act, el);
});
// 숫자 입력·슬라이더 (버섯 상점 판매 개수)
document.getElementById('ui').addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.input === 'shopq') { SHOP.q[el.dataset.id] = Math.max(0, Math.floor(+el.value || 0)); shopRefreshRow(el.dataset.id); }
});

// 캔버스 입력 (Pointer Events: 마우스·터치·펜 공용)
// 터치 전용: 균사 트리 두 손가락 확대·축소(pinch), 길게 누르기 = 끝까지 강화(Shift+클릭과 같음)
const PTR = new Map();   // 화면에 닿아 있는 포인터들 {id: 무대 좌표}
let pinch = null, pressT = null, pressDone = false;
cv.addEventListener('pointerdown', e => {
  Snd.init();
  const p = domToStage(e.clientX, e.clientY);
  PTR.set(e.pointerId, p);
  if (SCREEN === 'tree' && PTR.size === 2) {   // 두 번째 손가락: 확대·축소 시작
    const [a, b] = [...PTR.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: TREE.cam.z };
    TREE.drag = null; clearTimeout(pressT);
    return;
  }
  MOUSE.x = p.x; MOUSE.y = p.y;
  if (e.button === 2) { if (SCREEN === 'round') nextSpeed(); else if (SCREEN === 'tree' && !modalOpen()) { TREE.drag = null; treeMouseUp(p.x, p.y, true); } return; }
  if (e.button !== 0) return;
  MOUSE.down = true;
  if (SCREEN === 'tree') {
    treeMouseDown(p.x, p.y);
    if (e.pointerType !== 'mouse') {   // 길게 누르기
      pressDone = false; clearTimeout(pressT);
      pressT = setTimeout(() => { if (TREE.drag && !TREE.drag.moved && treeHit(p.x, p.y)) { pressDone = true; TREE.drag = null; treeMouseUp(p.x, p.y, true, true); } }, 500);
    }
  } else if (SCREEN === 'farm') farmMouseDown(p.x, p.y);
  else if (SCREEN === 'round' && R && !R.paused) {
    if (inBtn(CODEX_BTN, p)) { R.paused = true; codexSel = null; openCodex(true); return; }
    if (inBtn(PAUSE_BTN, p)) { openPause(); return; }
    if (inBtn(SPEED_BTN, p)) { nextSpeed(); Snd.ui(); return; }
    const q = { x: p.x / ZOOM, y: p.y / ZOOM };   // 필드 좌표
    if (R.phase === 'aim' && d2(q.x, q.y, LAUNCH.x, LAUNCH.y) < 160 * 160) R.aim = { sx: q.x, sy: q.y, x: q.x, y: q.y };
  }
});
window.addEventListener('pointermove', e => {
  const p = domToStage(e.clientX, e.clientY);
  if (PTR.has(e.pointerId)) PTR.set(e.pointerId, p);
  if (pinch) {
    if (PTR.size >= 2) {
      const [a, b] = [...PTR.values()], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const before = s2w(mx, my);
      TREE.cam.z = clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, 0.3, 1.8);
      const after = s2w(mx, my);
      TREE.cam.x += before.x - after.x; TREE.cam.y += before.y - after.y;
    }
    return;
  }
  // 손가락은 닿아 있을 때만 움직임을 받는다 (떼고 나면 바·트리는 그대로)
  if (e.pointerType !== 'mouse' && !PTR.has(e.pointerId)) return;
  MOUSE.x = p.x; MOUSE.y = p.y;
  if (SCREEN === 'tree' && !modalOpen() && (e.pointerType === 'mouse' || TREE.drag)) treeMouseMove(p.x, p.y);
  if (SCREEN === 'farm') cv.style.cursor = farmMouseMove(p.x, p.y) ? 'pointer' : ''; else if (cv.style.cursor) cv.style.cursor = '';
  if (SCREEN === 'round' && R && R.aim) { R.aim.x = p.x / ZOOM; R.aim.y = p.y / ZOOM; }
});
function pointerUp(e) {
  const had = PTR.delete(e.pointerId);
  if (pinch) { if (PTR.size < 2) pinch = null; MOUSE.down = false; return; }   // 확대·축소가 끝나도 노드는 사지 않는다
  clearTimeout(pressT);
  if (pressDone) { pressDone = false; MOUSE.down = false; return; }
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  if (e.pointerType !== 'mouse' && !had) return;
  const p = domToStage(e.clientX, e.clientY);
  MOUSE.down = false;
  if (SCREEN === 'tree' && TREE.drag) treeMouseUp(p.x, p.y, e.shiftKey, e.pointerType !== 'mouse');
  if (SCREEN === 'round' && R && R.aim) {
    const dx = R.aim.sx - p.x / ZOOM, dy = R.aim.sy - p.y / ZOOM;
    R.aim = null;
    if (Math.hypot(dx, dy) >= 20 && R.phase === 'aim') launch(Math.atan2(dy, dx));
  }
}
window.addEventListener('pointerup', pointerUp);
window.addEventListener('pointercancel', pointerUp);
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => {
  if (SCREEN !== 'tree') return;
  e.preventDefault();
  const p = domToStage(e.clientX, e.clientY);
  treeWheel(p.x, p.y, e.deltaY);
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'number') return;   // 상점 개수 입력 중
  if (e.code === 'Backquote') { DBG.open = !DBG.open; renderDebug(); e.preventDefault(); return; }
  if (e.code === 'KeyM') { Snd.muted = !Snd.muted; toast(Snd.muted ? '소리 끔' : '소리 켬'); return; }
  if (SCREEN === 'round' && R) {
    if (e.code === 'KeyF') nextSpeed();
    if (e.code === 'Escape') { if (modalOpen()) closeModal(); else openPause(); }
  } else if (e.code === 'Escape' && modalOpen()) closeModal();
  else if (e.code === 'Escape' && SCREEN === 'farm') { if (FARM_RT.view !== 'pets') farmGo('pets'); else enterTree(); }
});
window.addEventListener('blur', () => { if (SCREEN === 'round' && R && !R.paused && R.phase !== 'end') openPause(); });
// 모바일은 앱을 내리면 페이지가 언제든 꺼질 수 있어서, 숨겨질 때 저장하고 라운드는 멈춘다
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  if (G && SCREEN !== 'title') saveGame();
  if (SCREEN === 'round' && R && !R.paused && R.phase !== 'end') openPause();
});
// 세로로 돌리면(가로로 돌려 달라는 안내가 뜨면) 라운드를 멈춘다
window.addEventListener('resize', () => { if (IS_TOUCH && innerHeight > innerWidth && SCREEN === 'round' && R && !R.paused && R.phase !== 'end') openPause(); });
// 전체 화면 + 가로 고정 (안드로이드 크롬 등 지원하는 브라우저만. 안 되면 조용히 넘어간다)
function goFullscreen() {
  const d = document.documentElement, req = d.requestFullscreen || d.webkitRequestFullscreen;
  if (!req || document.fullscreenElement || document.webkitFullscreenElement) return;
  try {
    Promise.resolve(req.call(d)).then(() => { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); }).catch(() => {});
  } catch (err) { /* 지원 안 함 */ }
}

// ===== 버섯 아포칼립스 마을 (비주얼 기획서: 거대 버섯이 마을을 침범한 세계) =====
// shroomK: 거대 버섯 크기(1 = 뒤덮임, 0 = 사라짐) · dawn: 하늘 밝기(0 = 흐린 보랏빛, 1 = 맑은 아침)
const TOWN = { houses: null, giants: null, spores: null };
function drawTown(g, now, shroomK = 1, dawn = 0) {
  if (!TOWN.houses) {
    const rnd = seeded(77);
    TOWN.houses = [];
    for (let x = -40; x < W + 40;) { const w = 120 + rnd() * 110, h = 140 + rnd() * 170; TOWN.houses.push({ x, w, h, roof: rnd() < 0.6, broken: rnd() < 0.4, col: 40 + rnd() * 25, win: rnd() }); x += w + 10 + rnd() * 30; }
    TOWN.giants = [
      { x: 260, h: 640, r: 230, c: '#d9271c', c2: '#ffffff', dots: 1 },
      { x: 760, h: 460, r: 170, c: '#9b7cc4', c2: '#dccbef' },
      { x: 1180, h: 720, r: 260, c: '#f28a22', c2: '#f7d44a' },
      { x: 1620, h: 520, r: 200, c: '#3fae4a', c2: '#d2f2cf', dots: 1 },
      { x: 1890, h: 380, r: 150, c: '#8b5a3a', c2: '#f1e6d4' },
    ];
    TOWN.spores = Array.from({ length: 60 }, () => ({ x: rnd() * W, y: rnd() * H, s: 2 + rnd() * 4, p: rnd() * 6 }));
  }
  // 하늘
  const sky = g.createLinearGradient(0, 0, 0, H);
  const top = dawn ? `rgb(${lerp(60, 120, dawn)},${lerp(40, 190, dawn)},${lerp(90, 245, dawn)})` : '#3c2858';
  const bot = dawn ? `rgb(${lerp(180, 255, dawn)},${lerp(110, 220, dawn)},${lerp(120, 160, dawn)})` : '#b46a78';
  sky.addColorStop(0, top); sky.addColorStop(1, bot);
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  if (dawn > 0) { const sg = g.createRadialGradient(1500, 300, 20, 1500, 300, 260); sg.addColorStop(0, `rgba(255,245,200,${dawn})`); sg.addColorStop(1, 'rgba(255,245,200,0)'); g.fillStyle = sg; g.beginPath(); g.arc(1500, 300, 260, 0, TAU); g.fill(); }
  // 먼 언덕
  g.fillStyle = dawn ? `rgba(70,110,80,${0.6 + 0.4 * dawn})` : '#4a3550';
  g.beginPath(); g.moveTo(0, 720); for (let x = 0; x <= W; x += 80) g.lineTo(x, 700 - Math.sin(x / 260) * 60 - Math.cos(x / 130) * 20); g.lineTo(W, H); g.lineTo(0, H); g.fill();
  // 거대 버섯 (집 뒤)
  const baseY = 900;
  for (const gm of TOWN.giants) {
    const k = shroomK; if (k <= 0.01) continue;
    const h = gm.h * k, r = gm.r * k, sway = Math.sin(now * 0.6 + gm.x) * 4 * k;
    g.save(); g.translate(gm.x, baseY);
    g.fillStyle = '#efe2c8'; g.strokeStyle = '#2a1a20'; g.lineWidth = 6;
    g.beginPath(); g.moveTo(-r * 0.22, 0); g.quadraticCurveTo(-r * 0.3 + sway, -h * 0.5, -r * 0.16 + sway, -h); g.lineTo(r * 0.16 + sway, -h); g.quadraticCurveTo(r * 0.3 + sway, -h * 0.5, r * 0.22, 0); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(sway, -h, r, r * 0.62, 0, Math.PI, 0); g.quadraticCurveTo(sway, -h + r * 0.18, -r + sway, -h); g.closePath();
    g.fillStyle = gm.c; g.fill(); g.stroke();
    if (gm.dots) { g.fillStyle = gm.c2; for (const [dx, dy, s] of [[-0.5, -0.3, 0.12], [0.1, -0.5, 0.1], [0.5, -0.25, 0.11], [-0.1, -0.2, 0.07]]) { g.beginPath(); g.arc(sway + dx * r, -h + dy * r, s * r, 0, TAU); g.fill(); } }
    g.fillStyle = 'rgba(255,255,255,0.18)'; g.beginPath(); g.ellipse(sway - r * 0.4, -h - r * 0.35, r * 0.3, r * 0.1, -0.4, 0, TAU); g.fill();
    g.restore();
  }
  // 마을 집 (덩굴·버섯이 덮은 폐허)
  for (const hs of TOWN.houses) {
    const y = baseY - hs.h, c = hs.col;
    g.fillStyle = dawn ? `rgb(${c + 90 * dawn},${c + 60 * dawn},${c + 40 * dawn})` : `rgb(${c},${c - 8},${c + 10})`;
    g.strokeStyle = '#1e141a'; g.lineWidth = 4;
    g.fillRect(hs.x, y, hs.w, hs.h); g.strokeRect(hs.x, y, hs.w, hs.h);
    if (hs.roof) { g.beginPath(); g.moveTo(hs.x - 12, y); g.lineTo(hs.x + hs.w / 2, y - 60 - (hs.broken ? -14 : 0)); g.lineTo(hs.x + hs.w + 12, y); g.closePath(); g.fillStyle = dawn ? '#a5584a' : '#3a2230'; g.fill(); g.stroke(); }
    g.fillStyle = dawn ? 'rgba(255,230,150,0.85)' : hs.win > 0.6 ? 'rgba(255,200,110,0.6)' : 'rgba(20,10,20,0.7)';
    for (let wy = y + 30; wy < baseY - 50; wy += 60) for (let wx = hs.x + 20; wx < hs.x + hs.w - 30; wx += 50) g.fillRect(wx, wy, 22, 28);
    if (shroomK > 0.2) { // 지붕 위 작은 버섯
      g.fillStyle = hs.win > 0.5 ? '#e0252f' : '#f6da0c';
      g.beginPath(); g.ellipse(hs.x + hs.w * 0.7, y - 4, 14 * shroomK, 10 * shroomK, 0, Math.PI, 0); g.fill();
      g.fillStyle = '#5a8a3a'; g.fillRect(hs.x, y, hs.w * 0.3, 6);
    }
  }
  // 땅
  g.fillStyle = dawn ? '#6a9a4a' : '#3a2a2a'; g.fillRect(0, baseY, W, H - baseY);
  g.fillStyle = dawn ? '#5a8a3a' : '#2e2024'; g.fillRect(0, baseY, W, 14);
  // 떠다니는 포자
  for (const s of TOWN.spores) {
    const y = (s.y - now * 20 * s.s) % H, yy = y < 0 ? y + H : y;
    g.fillStyle = `rgba(255,235,200,${0.25 * shroomK + 0.05})`; g.beginPath(); g.arc(s.x + Math.sin(now + s.p) * 20, yy, s.s, 0, TAU); g.fill();
  }
}
function drawTitleBg(now) {
  const saved = SCREEN === 'ending';   // 엔딩 화면에서는 버섯이 걷힌 마을
  drawTown(ctx, now, saved ? 0 : 1, saved ? 1 : 0);
  drawGrandpa(ctx, 250, 1020, 2.2, now, Math.sin(now * 0.8) > 0.3);
  // 튕겨 다니는 낫 수확기
  const t = now * 0.6;
  ctx.save(); ctx.translate(960 + Math.cos(t) * 760, 540 + Math.sin(t * 1.3) * 400);
  drawHarvester(ctx, 'sam', 26, now * 8, 1, 1, null); ctx.restore();
}

let last = performance.now();
let fpsAcc = 0, fpsN = 0, fps = 60;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  if (G && SCREEN !== 'title') G.play += dt;
  farmTick(dt);
  const ts = now / 1000;
  if (SCREEN === 'round' && R) {
    // 바는 마우스 x를 부드럽게 따라감
    const target = clamp(MOUSE.x / ZOOM, FX0 + R.bar.len / 2, FX1 - R.bar.len / 2);
    if (!R.paused) R.bar.x = lerp(R.bar.x, target, 1 - Math.exp(-18 * dt));
    if (!R.paused && !modalOpen()) {
      if (R.hitstop > 0) R.hitstop -= dt;
      else {
        let total = dt * SPEED * DBG.speed;
        while (total > 1e-6 && R) { const h = Math.min(total, 1 / 60); simFrame(h); total -= h; }
      }
    }
    if (R) {
      drawRound(ctx);
      if (R.phase === 'end' && R.endT <= 0) finishRound();
    }
  } else if (SCREEN === 'tree') {
    drawTree(ctx, dt);
  } else if (SCREEN === 'farm') {
    drawFarm(ctx, dt, ts);
  } else if (SCREEN === 'cutscene') {
    drawCutscene(ctx, dt);
  } else {
    drawTitleBg(ts);
  }
  if (DBG.open) { const di = document.getElementById('dinfo'); if (di) di.textContent = `FPS ${fps}${R ? ` · 핀볼 ${R.balls.length} · 버섯 ${R.shrooms.length} · 군락지 ${R.colonies.length}/${R.st.maxCol}` : ''}`; }
  requestAnimationFrame(loop);
}

// 시작
BGS['forest|' + WW] = buildBackground('forest');
prepIcons();
const fontsReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load('40px Jua'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(() => { renderTitle(); requestAnimationFrame(loop); });

</script>
