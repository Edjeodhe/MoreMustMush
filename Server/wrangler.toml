# 명령줄(wrangler)로 배포할 때만 쓴다. 대시보드에 worker.js를 붙여 넣어 배포한다면 필요 없다.
# 비밀 키는 이 파일에 적지 않는다: npx wrangler secret put MMM_LOG_KEY
name = "moremustmush"
main = "worker.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "MMM_DB"
database_name = "moremustmosh_itch-logs"
database_id = "<대시보드 D1 > moremustmosh_itch-logs > Database ID>"
