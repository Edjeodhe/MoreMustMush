<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>세계수 도면</title>
<style>
  :root { --bg: #1d2330; --panel: #262d3d; --line: #3a4357; --text: #e8ecf4; --dim: #9aa4b8; --acc: #ffcf5a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 "Malgun Gothic", system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #side { width: 300px; flex: none; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 12px 40px; }
  #main { flex: 1; position: relative; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 12px; color: var(--acc); margin: 14px 0 6px; border-top: 1px solid var(--line); padding-top: 10px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
  button, select, input { font: inherit; color: var(--text); background: #323a4e; border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; }
  button:hover { border-color: var(--acc); }
  button.on { background: var(--acc); color: #222; border-color: var(--acc); }
  input[type=number] { width: 70px; }
  input[type=text] { width: 90px; }
  label { display: inline-flex; gap: 4px; align-items: center; }
  .stages button { width: 30px; padding: 3px 0; }
  .list { max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 5px; }
  .item { display: flex; align-items: center; gap: 6px; padding: 2px 6px; cursor: pointer; }
  .item:hover { background: #323a4e; }
  .item.sel { background: #4a4030; }
  .item .miss { color: #ff7b7b; }
  .item img { width: 22px; height: 22px; object-fit: contain; }
  .dim { color: var(--dim); }
  #status { position: absolute; left: 10px; bottom: 8px; color: var(--dim); pointer-events: none; }
  #dirty { color: #ff9b6b; }
  .help { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div id="side">
  <h1>세계수 도면 <span id="dirty"></span></h1>
  <div class="row stages" id="stages"></div>
  <div class="row"><button id="save">저장 (Ctrl+S)</button><button id="undo">되돌리기 (Ctrl+Z)</button></div>

  <h2>보기</h2>
  <div class="row">
    <label><input type="checkbox" id="vNav" checked>길</label>
    <label><input type="checkbox" id="vMush" checked>나무버섯</label>
    <label><input type="checkbox" id="vDeco" checked>장식</label>
    <label><input type="checkbox" id="vArt" checked>장식 그림</label>
  </div>
  <div class="row">그림 <input type="range" id="alpha" min="0" max="1" step="0.05" value="1"> <button id="fit">맞춤</button></div>

  <h2>도구</h2>
  <div class="row" id="tools">
    <button data-tool="move" class="on">선택·이동</button>
    <button data-tool="node">마디 추가</button>
    <button data-tool="edge">선 잇기</button>
    <button data-tool="mush">버섯 추가</button>
  </div>
  <div class="row">새 선 <select id="eKind"><option>walk</option><option>climb</option><option>hop</option></select>
    그림 <select id="eArt"><option value="">없음</option><option>plank</option><option>ladder</option><option>bridge</option></select></div>
  <div class="row">버섯 구역 <select id="mZone"></select></div>
  <div class="help">휠 = 확대, 가운데·오른쪽 끌기 = 이동. 선 잇기: 마디 두 개를 차례로 누름(이미 있으면 지움). Delete = 고른 것 지우기.</div>

  <h2>고른 것</h2>
  <div id="sel" class="dim">없음</div>

  <h2>장식 자리 <span class="dim" id="decoCount"></span></h2>
  <div class="list" id="decos"></div>

  <h2>나무버섯 자리</h2>
  <div id="mushInfo"></div>
  <div class="help">게임은 구역마다 앞 번호부터 슬롯 수만큼 쓴다(모자라면 공식 자리). 칸 수 = 그 단계 최대(아름다움 +2 포함).</div>
</div>
<div id="main"><canvas id="cv"></canvas><div id="status"></div></div>
<script type="module" src="/Tools/tree-layout/app.js"></script>
</body>
</html>
